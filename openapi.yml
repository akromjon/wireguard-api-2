openapi: 3.0.3
info:
  title: WireGuard API V2
  description: API for managing WireGuard and AmneziaWG 2.0 VPN users and service. The HTTP contract remains compatible with v1.
  version: 2.0.0
  contact:
    name: GitHub Repository
    url: https://github.com/akromjon/wireguard-api-2
servers:
  - url: http://localhost:8080
    description: Local development server

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: key
  
  schemas:
    APIResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the operation was successful
        message:
          type: string
          description: Human-readable message about the operation
        data:
          type: object
          description: Optional data returned from the operation
    
    Client:
      type: object
      properties:
        name:
          type: string
          description: Client name
        ipv4:
          type: string
          description: IPv4 address assigned to the client
        ipv6:
          type: string
          description: IPv6 address assigned to the client
        config:
          type: string
          description: "WireGuard or AmneziaWG 2.0 configuration file content for the client. AWG2 configs include S3, S4, H ranges, optional I1-I5, and the comment `# CHOP-AWG-PROFILE: awg2`."
    
    AddUserRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Client name (alphanumeric, underscore, dash only; max 15 chars)
          example: client1
        ipv4:
          type: string
          description: IPv4 address to assign (optional, auto-assigned if not provided)
          example: 10.8.0.2
        ipv6:
          type: string
          description: IPv6 address to assign (optional, auto-assigned if not provided)
          example: fd42:42:42::2
    
    DeleteUserRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Client name to delete
          example: client1

security:
  - ApiKeyAuth: []

paths:
  /api/users:
    get:
      summary: List all WireGuard clients
      description: Returns a list of all configured WireGuard clients
      operationId: listUsers
      responses:
        '200':
          description: List of clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Client'
        '401':
          description: Unauthorized - Missing or invalid API token
  
  /api/users/add:
    post:
      summary: Add a new WireGuard client
      description: Creates a new WireGuard client configuration
      operationId: addUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserRequest'
      responses:
        '200':
          description: Client created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Client added successfully
                  data:
                    $ref: '#/components/schemas/Client'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized - Missing or invalid API token
        '409':
          description: Client already exists
  
  /api/users/add-bulk:
    post:
      summary: Add multiple WireGuard clients in one request
      description: >
        Creates up to 500 clients under a single config lock and applies the
        configuration once at the end. Per-name failures (e.g. name already
        exists) do not abort the batch; the outcome of every requested name is
        returned in data.results. Invalid or duplicate names reject the whole
        request before anything is created.
      operationId: addUsersBulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - names
              properties:
                names:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: string
                    pattern: '^[a-zA-Z0-9_-]{1,15}$'
      responses:
        '200':
          description: At least one client was created and the configuration was applied under the same lock hold; individual names may still have failed — check data.results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Created 500 of 500 clients
                  data:
                    type: object
                    properties:
                      created:
                        type: integer
                      failed:
                        type: integer
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            success:
                              type: boolean
                            message:
                              type: string
                            ipv4:
                              type: string
                            ipv6:
                              type: string
        '400':
          description: Invalid request (no names, too many names, invalid or duplicate name)
        '404':
          description: Missing or invalid API token (the auth middleware masks failures as 404), or the endpoint does not exist on an older binary — callers cannot distinguish the two by status
        '500':
          description: Applying the configuration failed (data reports what was created), or no clients could be created at all (created=0)

  /api/users/claim:
    post:
      summary: Claim client configs, served from the spare stock when possible
      description: >
        Returns a client config for each of up to 500 names. A name that
        already exists returns its stored config (status existing), so a
        retry is safe. Other names take a pre-loaded spare peer from the stock
        (status claimed): only a comment line in the server config changes, so
        no syncconf runs. When the stock runs out, the remaining names are
        created like add-bulk does (status created) with one config apply,
        which also refills the stock. If the last config apply failed (or none
        ran since start), the server applies first and answers 500 when that
        apply fails, without handing anything out. Invalid or duplicate names
        reject the whole request before anything is touched.
      operationId: claimUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - names
              properties:
                names:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: string
                    pattern: '^[a-zA-Z0-9_-]{1,15}$'
      responses:
        '200':
          description: The request was processed; individual names may still have failed (status error) — check data.results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      claimed:
                        type: integer
                      created:
                        type: integer
                      existing:
                        type: integer
                      failed:
                        type: integer
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            success:
                              type: boolean
                            status:
                              type: string
                              enum: [claimed, created, existing, error]
                            message:
                              type: string
                            ipv4:
                              type: string
                            ipv6:
                              type: string
                            config:
                              type: string
        '400':
          description: Invalid request (no names, too many names, invalid or duplicate name)
        '404':
          description: Missing or invalid API token (the auth middleware masks failures as 404), or the endpoint does not exist on an older binary — callers cannot distinguish the two by status
        '500':
          description: The config apply before serving failed, the server config could not be updated, or the apply for newly created clients failed while nothing else succeeded

  /api/users/delete-bulk:
    post:
      summary: Delete many clients with one config apply
      description: >
        Removes up to 500 clients in one request: one config write and one
        apply (which also refills the spare stock). A name with neither a
        config block nor a client file is not_found, so a retry is safe.
        Spare peers are never matched by name. If the apply fails, the
        server answers 500 and reports no name as deleted (status error); the
        blocks are already out of the config file, so a retry reports
        not_found and the next successful apply removes the peers. Invalid or
        duplicate names reject the whole request before anything is touched.
      operationId: deleteUsersBulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - names
              properties:
                names:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: string
                    pattern: '^[a-zA-Z0-9_-]{1,15}$'
      responses:
        '200':
          description: The apply succeeded; individual names may still have failed (status error) — check data.results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      deleted:
                        type: integer
                      not_found:
                        type: integer
                      failed:
                        type: integer
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            success:
                              type: boolean
                            status:
                              type: string
                              enum: [deleted, not_found, error]
                            message:
                              type: string
        '400':
          description: Invalid request (no names, too many names, invalid or duplicate name)
        '404':
          description: Missing or invalid API token (the auth middleware masks failures as 404), or the endpoint does not exist on an older binary — callers cannot distinguish the two by status
        '500':
          description: The config could not be read or written, or the apply failed (data reports every name that would have been deleted as error)

  /api/users/delete:
    post:
      summary: Delete a WireGuard client
      description: Removes a WireGuard client configuration
      operationId: deleteUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUserRequest'
      responses:
        '200':
          description: Client deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Client deleted successfully
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: Client not found

  /api/users/delete-all:
    post:
      summary: Delete all WireGuard clients
      description: Removes all WireGuard client configurations
      operationId: deleteAllUsers
      responses:
        '200':
          description: All clients deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Successfully deleted all clients
                  data:
                    type: object
                    properties:
                      deleted_count:
                        type: integer
                        example: 5
                      clients:
                        type: array
                        items:
                          $ref: '#/components/schemas/Client'
                      files_deleted:
                        type: array
                        items:
                          type: string
                          example: "client1.conf"
        '401':
          description: Unauthorized - Missing or invalid API token
        '500':
          description: Failed to delete all clients

  /api/wireguard/status:
    get:
      summary: Get WireGuard service status
      description: Returns detailed status information about the WireGuard service
      operationId: getWireGuardStatus
      responses:
        '200':
          description: WireGuard status information
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      interface:
                        type: string
                        example: wg0
                      running:
                        type: boolean
                        example: true
                      peers:
                        type: array
                        items:
                          type: object
                      server_info:
                        type: object
                      system:
                        type: object
        '401':
          description: Unauthorized - Missing or invalid API token

  /api/health:
    get:
      summary: Get lightweight WireGuard health
      description: Returns the configured interface's running state and lightweight profile identity.
      operationId: getWireGuardHealth
      responses:
        '200':
          description: Lightweight WireGuard health state
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - running
                      - interface
                      - profile
                    properties:
                      running:
                        type: boolean
                        example: true
                      interface:
                        type: string
                        example: awg1
                      profile:
                        type: string
                        enum: [legacy, awg2]
                        example: awg2
        '404':
          description: Unauthorized - Missing or invalid API token

  /api/stats:
    get:
      summary: Get interface byte counters
      description: Cheap, side-effect-free counters for the billed network interface.
      operationId: getStats
      responses:
        '200':
          description: Interface counters
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      interface:
                        type: string
                        example: eth0
                      profile:
                        type: string
                        example: awg2
                      rx_bytes:
                        type: integer
                      tx_bytes:
                        type: integer
                      peers:
                        type: integer
                      uptime_seconds:
                        type: integer
                      echo_replies_total:
                        type: integer
                        description: UDP echo replies sent since the API process started.
        '404':
          description: Unauthorized - Missing or invalid API token

  /api/rtt:
    post:
      summary: Measure TCP connect time to region hosts
      description: |
        Connects to each target on port 443 (3 tries, 1 s timeout each) and
        returns the lowest connect time in ms (at least 1), or null when there is
        no result. Only public addresses are used. At most 6 requests per minute.
        `RTT_ENABLED=0` makes the route answer 404.
      operationId: measureRtt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                targets:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items:
                    type: object
                    required: [id, host, port]
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 64
                        description: Unique within the request.
                        example: eu-central
                      host:
                        type: string
                        example: dynamodb.eu-central-1.amazonaws.com
                      port:
                        type: integer
                        enum: [443]
      responses:
        '200':
          description: Connect times keyed by target id
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      rtt:
                        type: object
                        additionalProperties:
                          type: integer
                          nullable: true
                        example: {eu-central: 23, me-central: null}
        '400':
          description: Invalid request (bad target list, port, id, or body over 8 KB)
        '404':
          description: Unauthorized, or RTT_ENABLED=0
        '429':
          description: More than 6 requests in the current minute

  /api/wireguard/start:
    post:
      summary: Start the WireGuard service
      description: Starts the WireGuard service using systemctl
      operationId: startWireGuard
      responses:
        '200':
          description: Service started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: WireGuard service started successfully
        '401':
          description: Unauthorized - Missing or invalid API token
        '500':
          description: Failed to start the service

  /api/wireguard/stop:
    post:
      summary: Stop the WireGuard service
      description: Stops the WireGuard service using systemctl
      operationId: stopWireGuard
      responses:
        '200':
          description: Service stopped successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: WireGuard service stopped successfully
        '401':
          description: Unauthorized - Missing or invalid API token
        '500':
          description: Failed to stop the service

  /api/wireguard/restart:
    post:
      summary: Restart the WireGuard service
      description: Restarts the WireGuard service using systemctl
      operationId: restartWireGuard
      responses:
        '200':
          description: Service restarted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: WireGuard service restarted successfully
        '401':
          description: Unauthorized - Missing or invalid API token
        '500':
          description: Failed to restart the service
